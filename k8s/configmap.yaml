apiVersion: v1
kind: ConfigMap
metadata:
  name: tramplin-frontend
data:
  PUBLIC_HOST: tramplinn.tech
  API_UPSTREAM: http://tramplin-api:8000
  CLIENT_MAX_BODY_SIZE: 12m
  NGINX_ENVSUBST_OUTPUT_DIR: /tmp
  NGINX_ENVSUBST_FILTER: API_UPSTREAM|CLIENT_MAX_BODY_SIZE|NGINX_LOCAL_RESOLVERS|NGINX_PORT
  NGINX_PORT: '8080'

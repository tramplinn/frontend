apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tramplin
resources:
- configmap.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- ../nginx
images:
- name: registry.gitlab.com/tramplin1/frontend/web
  newTag: REPLACE_WITH_COMMIT_SHA
replacements:
- source:
    kind: ConfigMap
    name: tramplin-frontend
    fieldPath: data.PUBLIC_HOST
  targets:
  - select:
      kind: Ingress
      name: tramplin-frontend
    fieldPaths:
    - spec.rules.0.host
    - spec.tls.0.hosts.0
configMapGenerator:
- name: tramplin-nginx
  files:
  - nginx.conf

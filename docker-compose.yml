name: ${COMPOSE_PROJECT_NAME:-tramplin-frontend}

services:
  web:
    image: ${WEB_IMAGE:-tramplin-web:local}
    build: .
    environment:
      API_UPSTREAM: ${API_UPSTREAM:?set API_UPSTREAM}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-12m}
    networks:
      edge:
        aliases:
          - ${WEB_NETWORK_ALIAS:-tramplin-web}
    restart: unless-stopped

networks:
  edge:
    external: true
    name: tramplin-edge

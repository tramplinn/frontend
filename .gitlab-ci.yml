stages:
  - test
  - build
  - deploy
  - scan

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

default:
  tags: [docker, linux]

variables:
  WEB_IMAGE: "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
  PNPM_STORE: "$CI_PROJECT_DIR/.pnpm-store"

quality:
  stage: test
  needs: []
  image: node:22-bookworm-slim
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile --store-dir "$PNPM_STORE"
  script:
    - pnpm lint
    - pnpm format:check
    - pnpm test --reporter=default --reporter=junit --outputFile=report.xml
    - pnpm build
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 7 days

gitleaks:
  stage: test
  needs: []
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --verbose --redact

semgrep:
  stage: test
  needs: []
  image: semgrep/semgrep:1.172.0
  script:
    - semgrep scan --config=p/typescript --config=p/javascript --config=p/owasp-top-ten --error .

trivy-sca:
  stage: test
  needs: []
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .

build:
  stage: build
  needs:
    - job: quality
      artifacts: false
  image: docker:29.7.2
  retry:
    max: 2
    when: [script_failure, runner_system_failure]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull --provenance=false -t "$WEB_IMAGE" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
      image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$WEB_IMAGE"
    - docker push "$WEB_IMAGE"
  after_script:
    - docker logout "$CI_REGISTRY"
    - docker builder prune -af
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "stage"'

.deploy:
  stage: deploy
  needs:
    - job: build
      artifacts: false
    - job: gitleaks
      artifacts: false
    - job: semgrep
      artifacts: false
    - job: trivy-sca
      artifacts: false
  image: alpine:3.24.1
  retry:
    max: 2
    when: [script_failure, runner_system_failure]
  before_script:
    - apk add --no-cache openssh-client
    - export SSH_AUTH_SOCK=/tmp/ssh-agent.sock
    - ssh-agent -a "$SSH_AUTH_SOCK" >/dev/null
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf 'Host *\n  Port %s\n  StrictHostKeyChecking accept-new\n' "$SSH_PORT" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - ssh "$SSH_USER@$SERVER_IP" "mkdir -p $DEPLOY_PATH"
    - scp docker-compose.yml "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/"
    - scp "$DEPLOY_ENV" "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/.env"
    - ssh "$SSH_USER@$SERVER_IP" "chmod 600 $DEPLOY_PATH/.env"
    - printf '%s' "$CI_REGISTRY_PASSWORD" |
      ssh "$SSH_USER@$SERVER_IP" "docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"
    - |
      ssh "$SSH_USER@$SERVER_IP" \
        "bash -s -- '$DEPLOY_PATH' '$DEPLOY_PROJECT' '$WEB_IMAGE' '$CI_REGISTRY'" <<'REMOTE'
      set -euo pipefail

      cd "$1"
      export COMPOSE_PROJECT_NAME="$2"
      export WEB_IMAGE="$3"
      registry=$4
      compose=(docker compose --env-file .env)

      trap '"${compose[@]}" ps; "${compose[@]}" logs --tail 100' ERR
      trap 'docker logout "$registry" >/dev/null 2>&1 || true' EXIT

      "${compose[@]}" config --quiet
      # Реестр GitLab иногда отдаёт "repository does not exist" на pull через
      # пару секунд после успешного push — read-after-write ещё не разъехался
      # по бэкендам. Ретраим с бэкоффом вместо падения всего деплоя.
      for attempt in 1 2 3 4 5; do
        "${compose[@]}" pull --quiet && break
        [ "$attempt" -eq 5 ] && exit 1
        sleep $((attempt * 5))
      done
      "${compose[@]}" up -d --no-build --remove-orphans --wait --wait-timeout 60
      docker image prune -f
      REMOTE

deploy-stage:
  extends: .deploy
  variables:
    DEPLOY_PATH: "/opt/tramplin/stage/frontend"
    DEPLOY_PROJECT: "tramplin-frontend-stage"
    DEPLOY_ENV: "$STAGE_ENV"
  environment:
    name: staging
    url: "$STAGE_URL"
  resource_group: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage"'

deploy-production:
  extends: .deploy
  variables:
    DEPLOY_PATH: "/opt/tramplin/production/frontend"
    DEPLOY_PROJECT: "tramplin-frontend-prod"
    DEPLOY_ENV: "$PROD_ENV"
  environment:
    name: production
    url: "$PROD_URL"
  # Два деплоя подряд на один сервер могут пересечься в docker compose up
  # и словить конфликт имён контейнеров — resource_group ставит второй в очередь.
  resource_group: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

nuclei-scan:
  stage: scan
  needs:
    - job: deploy-stage
      artifacts: false
      optional: true
    - job: deploy-production
      artifacts: false
      optional: true
  image:
    name: projectdiscovery/nuclei:v3.11.0
    entrypoint: [""]
  script:
    - nuclei -u "$TARGET_URL" -severity critical,high,medium
      -tags cve,exposure,misconfiguration -jsonl -o nuclei-report.jsonl
  artifacts:
    when: always
    paths: [nuclei-report.jsonl]
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage"'
      variables:
        TARGET_URL: "$STAGE_URL"
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        TARGET_URL: "$PROD_URL"

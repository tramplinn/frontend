stages:
  - test
  - build
  - deploy
  - scan

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

default:
  tags: [saas-linux-small-amd64]

variables:
  WEB_IMAGE: "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
  PNPM_STORE: "$CI_PROJECT_DIR/.pnpm-store"

quality:
  stage: test
  needs: []
  image: node:22-bookworm-slim
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile --store-dir "$PNPM_STORE"
  script:
    - pnpm lint
    - pnpm format:check
    - pnpm test --reporter=default --reporter=junit --outputFile=report.xml
    - pnpm build
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 7 days

gitleaks:
  stage: test
  needs: []
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --verbose --redact

semgrep:
  stage: test
  needs: []
  image: semgrep/semgrep:1.172.0
  script:
    - semgrep scan --config=p/typescript --config=p/javascript --config=p/owasp-top-ten --error .

trivy-sca:
  stage: test
  needs: []
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .

build:
  stage: build
  needs:
    - job: quality
      artifacts: false
  image: docker:29.7.2
  services:
    - name: docker:29.7.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  retry:
    max: 2
    when: [script_failure, runner_system_failure]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull --provenance=false -t "$WEB_IMAGE" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
      image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$WEB_IMAGE"
    - docker push "$WEB_IMAGE"
  after_script:
    - docker logout "$CI_REGISTRY"
    - docker builder prune -af
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

validate-k8s:
  stage: test
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags: [saas-linux-small-amd64]
  script:
    - kubectl kustomize k8s/ > /dev/null

deploy-production:
  stage: deploy
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags: [saas-linux-small-amd64]
  variables:
    KUBE_CONTEXT: tramplin1/infra:tramplin
  resource_group: tramplin-production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  timeout: 60m
  script:
    - kubectl config use-context "$KUBE_CONTEXT"
    - sed -i "s/REPLACE_WITH_COMMIT_SHA/$CI_COMMIT_SHA/g" k8s/kustomization.yaml
    - |
      if grep -Eq 'REPLACE_|\.invalid' k8s/configmap.yaml; then
        echo 'Fill public settings in k8s/configmap.yaml before deployment.' >&2
        exit 1
      fi
    - kubectl apply --dry-run=server -k k8s/ >/dev/null
    - kubectl -n tramplin wait --for=condition=Ready externalsecret/gitlab-registry --timeout=180s
    - kubectl apply -k k8s/
    - kubectl -n tramplin rollout restart deployment/tramplin-frontend
    - kubectl -n tramplin rollout status deployment/tramplin-frontend --timeout=600s
    - kubectl -n tramplin wait --for=create certificate/tramplin-frontend-tls --timeout=120s
    - kubectl -n tramplin wait --for=condition=Ready certificate/tramplin-frontend-tls --timeout=600s

nuclei-scan:
  stage: scan
  needs: [deploy-production]
  image:
    name: projectdiscovery/nuclei:v3.11.0
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  before_script:
    - apk add --no-cache yq
  script:
    - public_host=$(yq -er '.data.PUBLIC_HOST' k8s/configmap.yaml)
    - nuclei -u "https://$public_host" -severity critical,high,medium -tags cve,exposure,misconfiguration -jsonl -o nuclei-report.jsonl
    - test ! -s nuclei-report.jsonl
  artifacts:
    when: always
    paths: [nuclei-report.jsonl]
    expire_in: 7 days
